services:
  backend:
    build: ./backend
    volumes:
      - ./backend/app:/app/app       # hot-reload en dev
      - ./data:/data                  # persistencia SQLite
      - ./data/static:/app/static     # persistencia de imágenes generadas
    env_file: .env
    command: >
      uvicorn app.main:app
      --host 0.0.0.0 --port 8000 --reload
    ports:
      - "127.0.0.1:8000:8000"         # expuesto solo en localhost para debugging
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      llama-cpp:
        condition: service_started
        required: false

  llama-cpp:
    build: ./llama-cpp
    volumes:
      - ${MODELS_DIR:-./models}:/models
    environment:
      MODEL_PATH: /models/${LLAMA_MODEL_FILE:-Llama-3.2-3B-Instruct-Q4_K_M.gguf}
      LLAMA_THREADS: ${LLAMA_THREADS:-8}

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
